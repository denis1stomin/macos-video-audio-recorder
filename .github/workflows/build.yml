name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild -project RecRex.xcodeproj -scheme RecRex -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Run unit tests
        run: |
          xcodebuild -project RecRex.xcodeproj -scheme RecRex -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
